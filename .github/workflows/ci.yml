# WHY CI: merge condition set by the expert — mechanically enforce the
# toolchain (typecheck + tests) on every push and PR to main so the
# charter's quality rules do not depend on human discipline alone.
#
# `integration/**` is included because that is where the work being assembled actually lives until the
# expert audits it. Without it the branch that will be reviewed had never been typechecked or tested by
# CI at all, which is the opposite of what this workflow exists for. Feature branches stay out to keep
# minutes down; they are covered once they land in integration or open a PR.
name: CI

on:
  push:
    branches: [main, "integration/**", "docs/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and typecheck (three lanes)
        run: npm ci && npm run typecheck
      - name: Guards (forbidden identifiers, licences)
        run: npm run guard:identifiers && npm run guard:modules && npm run guard:licences
      - name: Test
        run: npm run test:report
      - name: Test count matches the README
        run: npm run tests:count:check
      - name: Publish the count
        if: always()
        run: |
          if [ -f artifacts/test-report.json ]; then
            node -e "const r=require('./artifacts/test-report.json');const f=(r.testResults||[]).length;console.log('## Tests\n\n'+r.numTotalTests+' tests in '+f+' files, '+r.numFailedTests+' failed.')" >> "$GITHUB_STEP_SUMMARY"
          fi
  # The browser lane is separate on purpose: it needs a real Chromium, which the toolchain job has no business
  # downloading for every run. It builds the production bundle first, so a dev-server-only success cannot mask a bundle
  # that never builds, and then drives the page with Playwright.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the production bundle
        run: npm run build:browser
      - name: Check the bundle carries no Node-only module
        run: |
          if grep -E "node:fs|node:path|harness/evidence|fixtures/definitions" dist/browser/assets/*.js; then
            echo "::error::the browser bundle references a Node-only module"
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: test-results/
          if-no-files-found: ignore

  # Cross-site harness: the one thing the *.localhost lane cannot measure, because localhost is
  # not a registrable domain. Needs three engines, a certificate each browser genuinely trusts,
  # and root for /etc/hosts — so it is its own job and never a dependency of `verify`.
  cross-site-harness:
    name: cross-site harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browsers and certutil (as the runner user)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y libnss3-tools
      # Privileged work is limited to system setup: /etc/hosts, the system trust store for
      # WebKit, and ownership of the generated CA. No browser is launched from here.
      - name: System setup (privileged)
        env:
          SWC_HARNESS_STATE: ${{ runner.temp }}/swc-cross-site
        run: sudo --preserve-env=PATH,SWC_HARNESS_STATE npm run harness:cross-site:setup
      - name: Diagnostics
        run: |
          id
          whoami
          printf 'HOME=%s\n' "$HOME"
          ls -ld "$HOME" "$HOME/.pki" "$HOME/.pki/nssdb" 2>/dev/null || true
          ls -l "$HOME"/.cache/ms-playwright/*/[a-z]* 2>/dev/null | head -5 || true
          node -e "const {chromium,firefox,webkit}=require('@playwright/test');for(const [n,b] of Object.entries({chromium,firefox,webkit}))console.log(n, b.name(), b.executablePath())"
      # The harness runs as the runner user, with the runner's HOME, so Chromium trusts
      # $HOME/.pki/nssdb and Firefox trusts its own profile database. Never under sudo.
      - name: Run the cross-site matrix (unprivileged)
        env:
          SWC_HARNESS_STATE: ${{ runner.temp }}/swc-cross-site
        run: npm run test:browser:cross-site
      - name: System teardown (privileged)
        if: always()
        env:
          SWC_HARNESS_STATE: ${{ runner.temp }}/swc-cross-site
        run: sudo --preserve-env=PATH,SWC_HARNESS_STATE npm run harness:cross-site:teardown
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-site-harness
          path: artifacts/cross-site-harness.json
          if-no-files-found: warn
